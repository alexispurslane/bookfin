# Builds the signed release APK when a version tag (v1.2.3) is pushed, and
# publishes it as a GitHub release. The homepage's download button points at
# releases/latest/download/bookfin.apk, so it always gets the newest release.
#
# A manual run builds a version without a release and keeps the APK as a
# workflow artifact.
name: Release APK

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build as vMAJOR.MINOR.PATCH. A manual run publishes no release."
        required: true
        default: "v0.0.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - name: Free disk space for the Nix store
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Write the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.BOOKFIN_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BOOKFIN_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          key_dir="$RUNNER_TEMP/release-key"
          mkdir -p "$key_dir"
          base64 -d <<<"$KEYSTORE_BASE64" > "$key_dir/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=bookfin\nkeyPassword=%s\n' \
            "$key_dir/release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" \
            > "$key_dir/release-signing.properties"
          echo "BOOKFIN_RELEASE_SIGNING=$key_dir/release-signing.properties" >> "$GITHUB_ENV"

      - name: Build the release APK
        run: nix develop --command bash tool/release/build-release-apk.sh "$TAG"

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.apk \
            --title "Bookfin ${TAG#v}" --generate-notes --verify-tag

      - name: Keep the APK of a manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bookfin-${{ env.TAG }}
          path: dist/*.apk
          retention-days: 7

      - name: Remove the release key
        if: always()
        run: rm -rf "$RUNNER_TEMP/release-key"
