name: bookfin
description: "Bookfin Android audiobook and ebook companion."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4.ttf
  assets:
    - assets/cities/cities.tsv
    - assets/cities/CC-BY-4.0.txt
    - assets/cities/NOTICE.txt
    - assets/fonts/OFL-Outfit.txt
    - assets/fonts/OFL-Source-Serif-4.txt
