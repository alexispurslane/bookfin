name: bookfin
description: "Bookfin Android audiobook and ebook companion."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^9.2.4
  web: ^1.1.1
  crypto: 3.0.7
  audio_service: 0.18.19
  just_audio: 0.10.6
  audio_session: 0.2.4
  flutter_epub_viewer:
    path: packages/flutter_epub_viewer
  archive: 4.0.9
  xml: 6.6.1
  sqflite: 2.4.5

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: 4.5.4
  flutter_inappwebview: 6.2.0-beta.3
  shared_preferences_platform_interface: 2.4.2
  sqflite_common_ffi: 2.4.0+2

flutter:
  uses-material-design: true
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4.ttf
  assets:
    - assets/cities/cities.tsv
    - assets/cities/CC-BY-4.0.txt
    - assets/cities/NOTICE.txt
    - assets/fonts/OFL-Outfit.txt
    - assets/fonts/OFL-Source-Serif-4.txt
