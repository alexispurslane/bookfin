name: bookfin_host
description: Bookfin's Android host channels, as a plugin that Flutter adds to every engine.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.bookfin.bookfin
        pluginClass: BookfinHostPlugin
