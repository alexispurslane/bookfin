<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>html,body{margin:0;padding:0;background:#f6efe2}#reader{width:360px;height:640px}</style>
<script src="jszip.min.js"></script><script src="epub.min.js"></script></head>
<body><div id="reader"></div><script>
let book;
let rendition;
let spec;
let textSize = 18;
let ready = Promise.resolve();

async function report(operation) {
    await Promise.all(rendition.getContents().map(async content => {
        await content.document.fonts.ready;
        await Promise.all(Array.from(content.document.images).map(image => image.decode().catch(() => {})));
    }));
    const location = rendition.currentLocation();
    const contents = rendition.getContents();
    const section = contents.find(content => content.index === location.start.index);
    const range = section && section.range(location.start.cfi);
    const bodyText = section ? section.document.body.innerText : "";
    Probe.ready(JSON.stringify({operation, cfi: location.start.cfi,
        spine_index: location.start.index, href: location.start.href,
        section_text: bodyText.slice(0, 1200),
        anchor_text: range ? range.startContainer.textContent.slice(range.startOffset, range.startOffset + 180) : "",
        images: section ? Array.from(section.document.images).map(image => ({src:image.getAttribute("src"),loaded:image.complete && image.naturalWidth>0})) : [],
        text_size_css_px:textSize, whole_book_paginated:false}));
}

async function execute(operation) {
    if (operation === "open" || operation === "reopen") {
        if (rendition) rendition.destroy();
        if (book) book.destroy();
        document.getElementById("reader").replaceChildren();
        book = ePub("https://epubbench.invalid/" + spec.file);
        await book.ready;
        rendition = book.renderTo("reader", {width:360,height:640,spread:"none",flow:"paginated",allowScriptedContent:false});
        rendition.themes.default({
            "@font-face": {"font-family":"BookfinSerif","src":"url('https://epubbench.invalid/SourceSerif4.ttf')"},
            "html": {"font-family":"BookfinSerif,serif","color":"#39291f","background":"#f6efe2"},
            "body": {"overflow-wrap":"break-word","line-height":"1.65!important","padding":"0 18px!important"},
            "img": {"max-width":"100%!important","height":"auto"}
        });
        rendition.themes.fontSize(textSize + "px");
        await rendition.display(spec.target.href);
    } else if (operation === "page_turn") {
        await rendition.next();
    } else if (operation === "section_jump") {
        await rendition.display(spec.sections[spec.target.index+1].href);
    } else if (operation === "font_change") {
        textSize = textSize === 18 ? 20 : 18;
        const relocated = new Promise(resolve => rendition.once("relocated",resolve));
        rendition.themes.fontSize(textSize + "px");
        await relocated;
    }
    await report(operation);
}

window.command = operation => {
    ready = ready.then(() => execute(operation)).catch(error => Probe.failed(String(error.stack || error)));
};
fetch("https://epubbench.invalid/manifest.json").then(response => response.json()).then(manifest => {
    spec = manifest.books[new URL(location.href).searchParams.get("book") || "prose"];
    window.command("open");
}).catch(error => Probe.failed(String(error)));
</script></body></html>
