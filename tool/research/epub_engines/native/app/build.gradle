plugins { id 'com.android.application' }

android {
    namespace 'dev.bookfin.bench.epub'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.bookfin.bench.epub'
        minSdk 35
        targetSdk 36
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildFeatures { buildConfig true }
    flavorDimensions += 'engine'
    productFlavors {
        webview {
            dimension 'engine'
            applicationIdSuffix '.webview'
            buildConfigField 'String', 'ENGINE', '"webview"'
        }
        koreader {
            dimension 'engine'
            applicationIdSuffix '.koreader'
            buildConfigField 'String', 'ENGINE', '"koreader"'
        }
    }
    signingConfigs {
        benchmark {
            storeFile file('../../../../../.cache/epub-engines/benchmark.keystore')
            storePassword 'benchmark'
            keyAlias 'benchmark'
            keyPassword 'benchmark'
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.benchmark
        }
    }
    sourceSets.main {
        assets.srcDirs = ['../../assets', '../../../../../.cache/epub-engines/assets']
        java.srcDirs += ['../../shared/android']
    }
    sourceSets.koreader.jniLibs.srcDirs = ['../../../../../.cache/epub-engines/jni']
    packaging { jniLibs { useLegacyPackaging true } }
}
