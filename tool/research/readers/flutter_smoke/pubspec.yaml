name: reader_packaging_probe
publish_to: none
version: 0.0.1+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  pdfrx: 2.11.0
  epubx:
    path: epubx-compat
  ffi: 2.2.0
  crypto: 3.0.7
  html: 0.15.6
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/simple.pdf
    - assets/scanned.pdf
    - assets/river.epub
    - assets/mobi6-plain.mobi
    - assets/mobi6-palmdoc.mobi
    - assets/pg11-kf8.mobi
    - assets/licenses/
