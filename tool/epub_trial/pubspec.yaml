name: epubtrial
description: "Trial of a Flutter-native EPUB renderer (ticket boo-ju83). Not part of Bookfin."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_epub_viewer:
    path: ../../packages/flutter_epub_viewer
  xml: 6.6.1
  archive: 4.0.9

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    - books/
  fonts:
    - family: Source Serif 4
      fonts:
        - asset: ../../assets/fonts/SourceSerif4.ttf
